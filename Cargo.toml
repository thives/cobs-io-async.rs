[package]
name = "cobs-io-async"
version = "0.0.4"
authors = [
  "Thomas Ivesdal-Tronstad <>",
]
license = "MIT OR Apache-2.0"
description = "Runtime-independent reliable byte-stream transport over COBS framing for unreliable point-to-point links, with no_std support."
repository = "https://github.com/thives/cobs-io-async.rs"
keywords = ["cobs", "framing", "reliable", "transport", "no-std"]
edition = "2024"
rust-version = "1.87"

[features]
default = []
serde = ["dep:serde"]
defmt = ["dep:defmt"]

[dependencies]
defmt = { version = "1", optional = true }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = "0.8" }
rand = "0.10"

[[bench]]
name = "main"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition"]
